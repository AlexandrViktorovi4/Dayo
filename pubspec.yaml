name: planner
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  table_calendar: ^3.0.9
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.0
  flutter_svg: ^2.2.1
  image_picker: ^1.0.4
  flutter_native_splash: ^2.3.7
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  uuid: ^4.3.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/splash/icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/avatars/
    - assets/